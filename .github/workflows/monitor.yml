name: 空き状況監視

on:
  schedule:
    # JST 06:00〜23:45 の15分間隔（cronはUTC表記。JST = UTC+9）
    # UTC 21:00〜23:45 = JST 06:00〜08:45 / UTC 00:00〜14:45 = JST 09:00〜23:45
    - cron: "*/15 0-14,21-23 * * *"
  workflow_dispatch:

# 多重実行防止（前の実行が終わるまで次を開始しない）
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: 監視実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/monitor.py

      - name: スナップショットのコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update snapshot"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
