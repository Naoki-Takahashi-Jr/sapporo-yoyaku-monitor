name: 空き状況監視

on:
  schedule:
    # JST 06:00頃〜24:00頃 の15分間隔（cronはUTC表記。JST = UTC+9）
    # 分を 7,22,37,52 にずらしているのは、GitHub のスケジューラが混雑する
    # 毎時 0/15/30/45 分を避けて実行スキップを減らすため。
    # ※ schedule は GitHub 側の都合で遅延・間引きが起こるため、主たる起動は
    #    外部cron（cron-job.org）からの workflow_dispatch とし、これはバックアップ。
    - cron: "7,22,37,52 0-14,21-23 * * *"
  workflow_dispatch:

# 多重実行防止（前の実行が終わるまで次を開始しない）
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: 監視実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/monitor.py

      - name: スナップショットのコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update snapshot"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
