# =============================================================================
# 札幌市公共施設予約 空き状況監視 設定ファイル
# 施設の追加・削除・tier変更・通知時間帯の変更は、このファイルの編集だけで完結する
# =============================================================================

local_government_code: "011002"   # 札幌市（自治体コード）
date_range_days: 14               # 実行日から何日先まで監視するか
request_interval_seconds: 2.5     # 施設間のリクエスト間隔（秒）。対象システムへの負荷配慮のため必須（短くすると一時的な500も増える）
active_hours: "06:00-24:00"       # JST。この範囲外に起動された場合は何もせず終了する（安全弁）

# 「空き」とみなすステータス（このいずれかに変化したら通知）
#   A01=予約申込可(先着) / L01・L02=抽選申込可 / A03=電話受付 / U10=窓口受付
#   A02（空き表示のみ・ネット申込不可）も通知したい場合はリストに追加する
notify_statuses: [A01, L01, L02, A03, U10]

# 曜日ごとの通知対象時間帯（複数区間可）。枠の時間が一部でも重なれば通知対象
notify_windows:
  mon: ["18:00-22:00"]
  tue: ["18:00-22:00"]
  wed: ["18:00-22:00"]
  thu: ["18:00-22:00"]
  fri: ["18:00-22:00"]
  sat: ["00:00-24:00"]
  sun: ["00:00-24:00"]

# 利用目的カタログ（APIリクエストの組み立てに必要。基本的に変更不要）
purposes:
  4:  { category: "スポーツ（屋外）", name: "屋外サッカー" }
  30: { category: "スポーツ（屋内）", name: "サロンフットボール・フットサル" }
  48: { category: "スポーツ（屋内）", name: "室内サッカー" }
  49: { category: "スポーツ（屋内）", name: "ミニサッカー" }
  59: { category: "学校開放（屋外）", name: "サッカー" }
  68: { category: "学校開放（屋内）", name: "サロンフットボール・フットサル" }

